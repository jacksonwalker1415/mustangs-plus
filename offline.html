<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Offline | SMU+</title>
<meta name="robots" content="noindex, nofollow">
<script>document.write('<base href="'+(location.pathname.indexOf("/mustangs-plus/")===0?"/mustangs-plus/":"/")+'">')</script>
<meta name="theme-color" content="#354CA1">
<style>
html,body{margin:0;height:100%;background:#354CA1;color:#fff;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
main{min-height:100%;box-sizing:border-box;display:grid;place-items:center;text-align:center;padding:max(24px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left))}
img{display:block;width:min(240px,60vw);height:auto;margin:0 auto 28px}
h1{font-size:22px;margin:0 0 8px}
p{margin:0 auto 24px;max-width:30ch;color:rgba(255,255,255,.85)}
button{font:inherit;font-weight:700;min-height:44px;padding:0 24px;border:0;border-radius:999px;background:#CC0035;color:#fff;cursor:pointer}
small{display:block;margin-top:32px;max-width:36ch;font-size:13px;color:rgba(255,255,255,.7)}
</style>
</head>
<body>
<main>
  <div>
    <img src="assets/brand/smu-plus-logo-lg.png" alt="SMU+" width="240" height="84">
    <h1>You're offline</h1>
    <p>SMU+ needs a connection for this page. Check your signal and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
    <small>Concept built for an SMU Cox MBA class project. Not affiliated with or endorsed by SMU Athletics or Learfield.</small>
  </div>
</main>
</body>
</html>
